<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Night Wardrobe · Mochi Atelier</title>
  <link rel="stylesheet" href="/static/style.css?v=88">
  <link rel="stylesheet" href="/static/ui/tokens.css?v=92">
  <link rel="stylesheet" href="/static/ui/reset.css?v=92">
  <link rel="stylesheet" href="/static/ui/shell.css?v=93">
  <link rel="stylesheet" href="/static/ui/components.css?v=92">
  <link rel="stylesheet" href="/static/ui/utilities.css?v=92">
  <link rel="stylesheet" href="/static/ui/pages/images.css?v=96">
  <link rel="stylesheet" href="/static/ui/pages/gallery.css?v=92">
  <link rel="stylesheet" href="/static/ui/pages/assets.css?v=95">
  <link rel="stylesheet" href="/static/ui/pages/surgeon.css?v=92">
  {% block extra_css %}{% endblock %}
</head>
<body class="app-body">
  <div class="app-layout" id="appLayout">
    <!-- Mochi Atelier Sidebar (展开 210px / 折叠 62px，状态存 localStorage) -->
    <aside class="app-sidebar" id="appSidebar">
      <div class="sidebar-header">
        <a class="sidebar-brand brand" href="/workshop">
          <div class="brand-mark-box">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8L12 2z"/></svg>
          </div>
          <div class="brand-text-col">
            <span class="brand-title">Night Wardrobe</span>
            <span class="brand-subtitle font-mono">Mochi Atelier <small style="font-size:9.5px; opacity:0.75;">v1.24.1</small></span>
          </div>
        </a>
        <button type="button" class="sidebar-toggle-btn" id="sidebarToggle" title="折叠/展开侧栏 (Ctrl+B)" aria-label="折叠/展开侧栏">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>

      <nav class="sidebar-nav side-nav" data-main-nav aria-label="核心工作区">
        <!-- 1. Studio -->
        <div style="padding: 2px 4px 6px;">
          <a class="nav-item" href="/workshop" data-title="Studio · 创作工坊">
            <span class="nav-item-left">
              <span class="nav-item-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a4.5 4.5 0 0 0 0 9 4.5 4.5 0 0 1 0 9"/><circle cx="8.5" cy="8.5" r="1.5"/><circle cx="15.5" cy="8.5" r="1.5"/><circle cx="15.5" cy="15.5" r="1.5"/></svg>
              </span>
              <span>创作工坊</span>
            </span>
            <span class="nav-item-badge">⌥1</span>
          </a>
        </div>

        <!-- 2. Images 分组 -->
        <div class="nav-group-title">图片</div>
        <a class="nav-item" href="/outputs" data-title="生图查看">
          <span class="nav-item-left">
            <span class="nav-item-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            </span>
            <span>生图查看</span>
          </span>
          <span class="nav-item-dot"></span>
        </a>
        <a class="nav-item" href="/gallery" data-title="参考图库">
          <span class="nav-item-left">
            <span class="nav-item-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z"/></svg>
            </span>
            <span>参考图库</span>
          </span>
        </a>

        <!-- 3. Assets 分组 -->
        <div class="nav-group-title">资源</div>
        <a class="nav-item" href="/characters" data-title="角色卡">
          <span class="nav-item-left">
            <span class="nav-item-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <span>角色卡</span>
          </span>
        </a>
        <a class="nav-item" href="/loras" data-title="LoRA 库">
          <span class="nav-item-left">
            <span class="nav-item-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            </span>
            <span>LoRA 库</span>
          </span>
        </a>
        <a class="nav-item" href="/recipes" data-title="配方库">
          <span class="nav-item-left">
            <span class="nav-item-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            </span>
            <span>配方库</span>
          </span>
        </a>
        <a class="nav-item" href="/tags" data-title="标签库">
          <span class="nav-item-left">
            <span class="nav-item-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><circle cx="7" cy="7" r="1.5"/></svg>
            </span>
            <span>标签库</span>
          </span>
        </a>

        <!-- 4. Workflows -->
        <div class="nav-group-title">工作流</div>
        <a class="nav-item" href="/workflows" data-title="节点工作流">
          <span class="nav-item-left">
            <span class="nav-item-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            </span>
            <span>节点工作流</span>
          </span>
        </a>
      </nav>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <button type="button" class="settings-nav-btn" id="sidebarSettingsBtn" onclick="if(window.openCopilotSettingsDialog){window.openCopilotSettingsDialog();}else{location.href='/workshop';}" data-title="Settings · 系统设置">
          <span class="nav-item-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09A1.65 1.65 0 0 0 19.4 15z"/></svg>
          </span>
          <span>Settings 系统设置</span>
        </button>
      </div>
      <div class="sidebar-resizer" id="sidebarResizer" role="separator" aria-orientation="vertical" aria-label="拖动调整侧栏宽度" title="拖动调整侧栏宽度 (双击恢复默认)"></div>
    </aside>

    <!-- App Workspace -->
    <div class="app-workspace">
      <!-- Topbar -->
      <header class="workspace-topbar">
        <div class="topbar-breadcrumb">
          <div class="breadcrumb-path" id="topbarContext">
            <span id="topbarTitle">Studio</span>
            <span style="color:var(--mochi-muted);">/</span>
            <span class="breadcrumb-active" id="topbarSubtitle">Prompt 创作工坊</span>
          </div>
          <div class="topbar-model-badge">
            <span class="model-dot"></span>
            <span>SDXL · Turbo</span>
          </div>
        </div>
        <div class="topbar-right-actions">
          <a class="btn-inspire-pill" href="/gacha" data-full-load title="✦ Inspire 灵感抽卡">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8L12 2z"/></svg>
            <span>+ Inspire / 灵感抽卡</span>
          </a>
          <div style="height:16px; width:1px; background:var(--mochi-border);"></div>
          <div class="user-avatar-pill" title="Mochi Atelier">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          </div>
        </div>
      </header>

      <div id="nav-loading" class="nav-loading">加载中...</div>
      <div id="toast-container" class="toast-container" aria-live="polite"></div>
      <main class="app-main workspace-main">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script>
  (function() {
    // 1. Sidebar Collapse & Resize Management (localStorage persisted)
    var sidebar = document.getElementById('appSidebar');
    var toggleBtn = document.getElementById('sidebarToggle');
    var sidebarResizer = document.getElementById('sidebarResizer');
    var isCollapsed = localStorage.getItem('nw_sidebar_collapsed') === '1';
    var DEFAULT_SIDEBAR_WIDTH = 210;
    var MIN_SIDEBAR_WIDTH = 160;
    var MAX_SIDEBAR_WIDTH = 360;

    function setSidebarWidth(width, persist) {
      if (!sidebar) return;
      var clamped = Math.max(MIN_SIDEBAR_WIDTH, Math.min(MAX_SIDEBAR_WIDTH, Math.round(width)));
      document.documentElement.style.setProperty('--sidebar-width', clamped + 'px');
      if (persist) {
        localStorage.setItem('nw_sidebar_width', clamped + 'px');
      }
      return clamped;
    }

    function setSidebarCollapsed(collapsed) {
      if (!sidebar) return;
      if (collapsed) {
        sidebar.classList.add('collapsed');
        document.body.classList.add('sidebar-collapsed');
        document.documentElement.style.setProperty('--sidebar-width', '62px');
        localStorage.setItem('nw_sidebar_collapsed', '1');
      } else {
        sidebar.classList.remove('collapsed');
        document.body.classList.remove('sidebar-collapsed');
        var savedW = parseInt(localStorage.getItem('nw_sidebar_width'), 10) || DEFAULT_SIDEBAR_WIDTH;
        setSidebarWidth(savedW, false);
        localStorage.setItem('nw_sidebar_collapsed', '0');
      }
    }

    if (toggleBtn) {
      toggleBtn.addEventListener('click', function(e) {
        e.preventDefault();
        setSidebarCollapsed(!sidebar.classList.contains('collapsed'));
      });
    }
    // Keyboard shortcut Ctrl+B to toggle sidebar
    window.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') {
        e.preventDefault();
        if (sidebar) setSidebarCollapsed(!sidebar.classList.contains('collapsed'));
      }
    });

    if (isCollapsed) {
      setSidebarCollapsed(true);
    } else {
      var savedWidth = localStorage.getItem('nw_sidebar_width');
      if (savedWidth) {
        var parsed = parseInt(savedWidth, 10);
        if (parsed && !isNaN(parsed)) setSidebarWidth(parsed, false);
      }
    }

    // Sidebar Resizer Drag Logic
    if (sidebarResizer) {
      var sidebarDragging = false;

      sidebarResizer.addEventListener('mousedown', function(e) {
        if (sidebar.classList.contains('collapsed')) return;
        sidebarDragging = true;
        document.body.classList.add('resizing');
        document.body.style.cursor = 'col-resize';
        sidebarResizer.classList.add('is-dragging');
        e.preventDefault();
      });

      window.addEventListener('mousemove', function(e) {
        if (!sidebarDragging) return;
        setSidebarWidth(e.clientX, false);
      });

      window.addEventListener('mouseup', function(e) {
        if (!sidebarDragging) return;
        sidebarDragging = false;
        document.body.classList.remove('resizing');
        document.body.style.cursor = '';
        sidebarResizer.classList.remove('is-dragging');
        if (e && e.clientX) {
          setSidebarWidth(e.clientX, true);
        }
      });

      sidebarResizer.addEventListener('dblclick', function(e) {
        e.preventDefault();
        setSidebarWidth(DEFAULT_SIDEBAR_WIDTH, true);
        if (window.showToast) window.showToast('侧边栏宽度已恢复默认', 'info', 1000);
      });
    }

    // 2. Global Toast
    window.showToast = function(message, type, duration) {
      type = type || 'info';
      duration = duration || 2400;
      var container = document.getElementById('toast-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toast-container';
        container.className = 'toast-container';
        document.body.appendChild(container);
      }
      var toast = document.createElement('div');
      toast.className = 'toast toast-' + type;
      var icon = 'ℹ';
      if (type === 'success') icon = '✓';
      else if (type === 'error') icon = '✕';
      toast.innerHTML = '<span class="toast-icon">' + icon + '</span><span class="toast-text">' + message + '</span>';
      container.appendChild(toast);
      requestAnimationFrame(function() { toast.classList.add('show'); });
      setTimeout(function() {
        toast.classList.remove('show');
        setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 280);
      }, duration);
    };

    // 3. Workbench Append Helper
    window.appendTagsToWorkbench = function(tagsOrString, options) {
      options = options || {};
      var raw = (typeof tagsOrString === 'string') ? tagsOrString : (Array.isArray(tagsOrString) ? tagsOrString.join(', ') : '');
      if (!raw || !raw.trim()) {
        if (window.showToast) window.showToast('没有可填入的标签内容', 'info');
        return;
      }
      var saved = sessionStorage.getItem('wardrobe_selected_tags') || '';
      var splitTags = function(text) {
        return (text || '').split(',').map(function(s) { return s.trim(); }).filter(Boolean);
      };
      var existing = splitTags(saved);
      var incoming = splitTags(raw);
      var combined = [];
      if (options.mode === 'replace') {
        combined = incoming;
      } else {
        var set = new Set(existing);
        combined = existing.slice();
        incoming.forEach(function(item) {
          if (!set.has(item)) {
            combined.push(item);
            set.add(item);
          }
        });
      }
      var resultStr = combined.join(', ') + (combined.length ? ', ' : '');
      sessionStorage.setItem('wardrobe_selected_tags', resultStr);

      if (typeof window.writeSelectedTags === 'function') {
        window.writeSelectedTags(combined);
      }
      var label = options.label ? ('「' + options.label + '」') : '';
      if (window.showToast) {
        window.showToast('已将 ' + label + incoming.length + ' 个 Tag 填入工作台', 'success');
      }
    };

    // 4. SPA Navigation and Topbar context
    const nav = document.querySelector('[data-main-nav]');
    const main = document.querySelector('main');
    const overlay = document.getElementById('nav-loading');
    const topbarTitle = document.getElementById('topbarTitle');
    const topbarSubtitle = document.getElementById('topbarSubtitle');

    function updateActiveNav(path) {
      if (!nav) return;
      var currentA = null;
      nav.querySelectorAll('a').forEach(a => {
        var href = a.getAttribute('href');
        var active = (href === '/' && (path === '/' || path === '/workshop')) || (href !== '/' && path.startsWith(href));
        a.classList.toggle('active', active);
        if (active) currentA = a;
      });

      // Update Topbar
      if (topbarTitle && topbarSubtitle) {
        if (path.startsWith('/workshop') || path === '/') {
          topbarTitle.textContent = '创作';
          topbarSubtitle.textContent = '提示词工坊';
        } else if (path.startsWith('/outputs')) {
          topbarTitle.textContent = '图片';
          topbarSubtitle.textContent = '生图查看';
        } else if (path.startsWith('/gallery')) {
          topbarTitle.textContent = '图片';
          topbarSubtitle.textContent = '参考图库';
        } else if (path.startsWith('/characters')) {
          topbarTitle.textContent = '资源';
          topbarSubtitle.textContent = '角色卡';
        } else if (path.startsWith('/loras')) {
          topbarTitle.textContent = '资源';
          topbarSubtitle.textContent = 'LoRA 库';
        } else if (path.startsWith('/recipes')) {
          topbarTitle.textContent = '资源';
          topbarSubtitle.textContent = '配方库';
        } else if (path.startsWith('/tags')) {
          topbarTitle.textContent = '资源';
          topbarSubtitle.textContent = '标签库';
        } else if (path.startsWith('/workflows')) {
          topbarTitle.textContent = '工作流';
          topbarSubtitle.textContent = '工作流';
        } else if (path.startsWith('/prompt-surgeon')) {
          topbarTitle.textContent = '提示词编辑';
          topbarSubtitle.textContent = '独立手术室';
        } else if (path.startsWith('/llm')) {
          topbarTitle.textContent = '设置';
          topbarSubtitle.textContent = '系统配置';
        }
      }
    }

    function execScripts(container) {
      container.querySelectorAll('script').forEach(old => {
        const s = document.createElement('script');
        if (old.src) { s.src = old.src; } else { s.textContent = old.textContent; }
        old.replaceWith(s);
      });
    }

    function saveTextareas() {
      if (!main) return;
      main.querySelectorAll('textarea[id], input[id], select[id]').forEach(el => {
        if (el.type === 'hidden' || el.type === 'checkbox') return;
        sessionStorage.setItem('_persist_' + el.id, el.value);
      });
    }

    function restoreTextareas() {
      if (!main) return;
      main.querySelectorAll('textarea[id], input[id], select[id]').forEach(el => {
        if (el.type === 'hidden' || el.type === 'checkbox') return;
        const saved = sessionStorage.getItem('_persist_' + el.id);
        if (saved != null) el.value = saved;
      });
    }

    function isHeavyPage() {
      return main && main.querySelectorAll('*').length > 4000;
    }

    function showOverlay() {
      if (overlay) {
        overlay.style.opacity = '1';
        overlay.style.pointerEvents = 'auto';
      }
    }

    function hideOverlay() {
      if (overlay) {
        overlay.style.opacity = '0';
        overlay.style.pointerEvents = 'none';
      }
    }

    async function navigate(url, pushState) {
      showOverlay();
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

      if (typeof window.__wardrobePageCleanup === 'function') window.__wardrobePageCleanup();
      saveTextareas();
      const heavy = isHeavyPage();
      if (heavy && main) main.textContent = '';

      try {
        const resp = await fetch(url);
        if (!resp.ok) { hideOverlay(); return false; }
        const html = await resp.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const newMain = doc.querySelector('main');
        if (!newMain || !main) { hideOverlay(); return false; }
        main.innerHTML = newMain.innerHTML;
        execScripts(main);
        restoreTextareas();
        hideOverlay();
        if (pushState) history.pushState(null, '', url);
        updateActiveNav(new URL(url, location.origin).pathname);
        window.scrollTo(0, 0);
        return true;
      } catch(e) { hideOverlay(); return false; }
    }

    if (nav) {
      nav.addEventListener('click', e => {
        const a = e.target.closest('a');
        if (!a || !a.getAttribute('href').startsWith('/')) return;
        if (a.hasAttribute('data-full-load')) return;
        e.preventDefault();
        navigate(a.href, true).then(ok => { if (!ok) location.href = a.href; });
      });
    }

    document.querySelectorAll('.brand').forEach(brand => {
      brand.addEventListener('click', e => {
        e.preventDefault();
        navigate('/workshop', true).then(ok => { if (!ok) location.href = '/workshop'; });
      });
    });

    window.addEventListener('popstate', () => { navigate(location.href, false); });

    updateActiveNav(location.pathname);
  })();
  </script>
</body>
</html>
